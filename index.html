<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optimiseur de Livraisons - Isothermic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .suggestion-item:hover { background-color: #334155; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">
    <div class="max-w-2xl mx-auto space-y-6">
        
        <!-- En-tête -->
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
            <h1 class="text-2xl font-bold text-blue-400 flex items-center gap-2">
                <span>🚛</span> Optimiseur de Route de Livraison
            </h1>
            <p class="text-slate-400 text-sm mt-1">
                Calculez l'itinéraire le plus rapide et générez le trajet direct pour Google Maps.
            </p>
        </div>

        <!-- Historique des routes -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
            <div class="flex justify-between items-center">
                <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">📁 Anciennes routes enregistrées</label>
                <button onclick="clearHistory()" class="text-xs text-rose-400 hover:underline">Vider l'historique</button>
            </div>
            <div class="flex gap-2">
                <select id="historySelect" onchange="loadSelectedRoute()" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                    <option value="">-- Sélectionner une route enregistrée --</option>
                </select>
                <button onclick="saveCurrentRoutePrompt()" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-sm text-slate-200 font-medium transition">
                    💾 Enregistrer
                </button>
            </div>
        </div>

        <!-- Formulaire principal -->
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl space-y-4">
            
            <!-- Point de départ -->
            <div class="relative">
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Point de Départ (ex: Usine)</label>
                <input type="text" id="start" placeholder="Entrez le point de départ" oninput="handleAutocomplete(this)"
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-blue-500">
                <div class="suggestions-list absolute left-0 right-0 top-full mt-1 bg-slate-800 border border-slate-700 rounded-lg shadow-xl max-h-48 overflow-y-auto z-50 divide-y divide-slate-700"></div>
            </div>

            <!-- Adresses de livraison -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Adresses de livraison</label>
                <div id="stopsContainer" class="space-y-2">
                    <div class="relative stop-group">
                        <div class="flex gap-2">
                            <input type="text" class="stop-input flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-blue-500" 
                                placeholder="Adresse de livraison 1" oninput="handleAutocomplete(this)">
                            <button onclick="removeStop(this)" class="bg-rose-500/20 text-rose-300 hover:bg-rose-500/30 px-3 rounded-lg transition">✕</button>
                        </div>
                        <div class="suggestions-list absolute left-0 right-0 top-full mt-1 bg-slate-800 border border-slate-700 rounded-lg shadow-xl max-h-48 overflow-y-auto z-50 divide-y divide-slate-700"></div>
                    </div>
                </div>
                
                <button onclick="addStopInput()" class="mt-3 w-full border border-dashed border-slate-600 text-slate-300 hover:bg-slate-700/50 py-2.5 rounded-lg text-sm font-medium transition flex items-center justify-center gap-2">
                    <span>+</span> Ajouter une adresse
                </button>
            </div>

            <!-- Point d'arrivée -->
            <div class="relative">
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Point d'Arrivée Finale</label>
                <input type="text" id="end" placeholder="Entrez le point d'arrivée" oninput="handleAutocomplete(this)"
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-blue-500">
                <div class="suggestions-list absolute left-0 right-0 top-full mt-1 bg-slate-800 border border-slate-700 rounded-lg shadow-xl max-h-48 overflow-y-auto z-50 divide-y divide-slate-700"></div>
            </div>

            <!-- Case à cocher Retour -->
            <div class="flex items-center gap-2 pt-1">
                <input type="checkbox" id="returnToStart" onchange="toggleReturnToStart(this)" class="w-4 h-4 rounded border-slate-700 bg-slate-900 text-blue-500 focus:ring-blue-500 focus:ring-offset-slate-800">
                <label for="returnToStart" class="text-sm text-slate-300 cursor-pointer">Retourner au point de départ à la fin de la tournée</label>
            </div>

            <!-- Bouton Calculer -->
            <button onclick="processRoute()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-lg shadow-lg shadow-blue-600/30 transition duration-200">
                Calculer la Route Optimisée
            </button>
        </div>

        <!-- Loader -->
        <div id="loader" class="hidden bg-slate-800 p-6 rounded-xl border border-slate-700 text-center text-blue-400 font-medium animate-pulse">
            Calcul de l'itinéraire optimal en cours...
        </div>

        <!-- Zone de Résultats -->
        <div id="results" class="hidden bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl space-y-6">
            <h2 class="text-lg font-bold text-slate-100 border-b border-slate-700 pb-2">Ordre de Livraison Optimisé</h2>
            <ol id="orderedList" class="space-y-2"></ol>
            <div id="routeMeta" class="text-sm text-slate-400 bg-slate-900/50 p-3 rounded-lg border border-slate-700/50"></div>

            <a id="gmapsLink" href="#" target="_blank" class="block w-full">
                <button class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-lg shadow-lg shadow-emerald-600/30 transition duration-200 flex items-center justify-center gap-2">
                    <span>📱</span> Ouvrir dans Google Maps
                </button>
            </a>

            <div class="text-center pt-2">
                <p class="text-xs text-slate-400 mb-3">Scannez le QR Code avec le téléphone du livreur :</p>
                <div id="qrcode" class="bg-white p-3 rounded-xl inline-block shadow-lg"></div>
            </div>
        </div>

    </div>

    <script>
        const MAPBOX_KEY = "pk.eyJ1Ijoibmljby1pc28iLCJhIjoiY213NTNyc3MxMDMwbjMwcHdvaml0czF2NCJ9.ZRWlbuVtdw-ZWLN0qDeW2w";

        let autocompleteTimeout;

        function handleAutocomplete(inputElement) {
            clearTimeout(autocompleteTimeout);
            const group = inputElement.closest('.relative');
            const listDiv = group.querySelector('.suggestions-list');
            const query = inputElement.value.trim();

            if (query.length < 3) {
                listDiv.innerHTML = '';
                return;
            }

            autocompleteTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(query)}.json?access_token=${MAPBOX_KEY}&country=ca&language=fr&limit=5`);
                    const data = await res.json();
                    listDiv.innerHTML = '';
                    
                    if (data.features) {
                        data.features.forEach(item => {
                            const div = document.createElement('div');
                            div.className = 'suggestion-item px-4 py-2 text-xs text-slate-200 cursor-pointer transition';
                            div.innerText = item.place_name_fr || item.place_name;
                            div.onclick = () => {
                                inputElement.value = item.place_name_fr || item.place_name;
                                listDiv.innerHTML = '';
                            };
                            listDiv.appendChild(div);
                        });
                    }
                } catch (e) {
                    console.error(e);
                }
            }, 250);
        }

        document.addEventListener('click', (e) => {
            if (!e.target.matches('input[type="text"]')) {
                document.querySelectorAll('.suggestions-list').forEach(el => el.innerHTML = '');
            }
        });

        function addStopInput(value = '') {
            const container = document.getElementById('stopsContainer');
            const div = document.createElement('div');
            div.className = 'relative stop-group';
            div.innerHTML = `
                <div class="flex gap-2">
                    <input type="text" class="stop-input flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-blue-500" 
                        placeholder="Adresse de livraison" value="${value}" oninput="handleAutocomplete(this)">
                    <button onclick="removeStop(this)" class="bg-rose-500/20 text-rose-300 hover:bg-rose-500/30 px-3 rounded-lg transition">✕</button>
                </div>
                <div class="suggestions-list absolute left-0 right-0 top-full mt-1 bg-slate-800 border border-slate-700 rounded-lg shadow-xl max-h-48 overflow-y-auto z-50 divide-y divide-slate-700"></div>
            `;
            container.appendChild(div);
        }

        function removeStop(btn) {
            const container = document.getElementById('stopsContainer');
            if (container.children.length > 1) {
                btn.closest('.stop-group').remove();
            }
        }

        function toggleReturnToStart(checkbox) {
            const endInput = document.getElementById('end');
            if (checkbox.checked) {
                endInput.value = document.getElementById('start').value;
                endInput.disabled = true;
                endInput.classList.add('opacity-50');
            } else {
                endInput.disabled = false;
                endInput.classList.remove('opacity-50');
            }
        }

        async function geocode(address) {
            const res = await fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(address)}.json?access_token=${MAPBOX_KEY}&country=ca&limit=1`);
            const data = await res.json();
            if (!data || !data.features || data.features.length === 0) {
                throw new Error(`Adresse introuvable : ${address}`);
            }
            const center = data.features[0].center; // [lon, lat]
            return { lat: center[1], lon: center[0], name: address };
        }

        async function processRoute() {
            const startAddr = document.getElementById('start').value.trim();
            const endAddr = document.getElementById('end').value.trim();
            const stopInputs = Array.from(document.querySelectorAll('.stop-input')).map(i => i.value.trim()).filter(v => v !== '');

            if (!startAddr || !endAddr || stopInputs.length === 0) {
                alert("Veuillez remplir le départ, l'arrivée et au moins une adresse de livraison.");
                return;
            }

            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('results').classList.add('hidden');

            try {
                const allAddresses = [startAddr, ...stopInputs, endAddr];
                const coords = await Promise.all(allAddresses.map(geocode));

                const osrmCoords = coords.map(c => `${c.lon},${c.lat}`).join(';');
                const osrmUrl = `https://router.project-osrm.org/trip/v1/driving/${osrmCoords}?source=first&destination=last&roundtrip=false`;

                const routeRes = await fetch(osrmUrl);
                const routeData = await routeRes.json();

                if (routeData.code !== 'Ok') throw new Error("Impossible d'optimiser le trajet.");

                // Correction du tri des points de passage selon l'optimisation OSRM
                const orderedCoords = routeData.waypoints
                    .sort((a, b) => a.waypoint_index - b.waypoint_index)
                    .map(wp => coords[wp.trips_index]);

                displayResults(orderedCoords, routeData.trips[0]);
                autoSaveRoute(startAddr, endAddr, stopInputs);
            } catch (err) {
                alert("Erreur : " + err.message);
            } finally {
                document.getElementById('loader').classList.add('hidden');
            }
        }

        function displayResults(orderedPoints, tripData) {
            const listEl = document.getElementById('orderedList');
            listEl.innerHTML = '';

            orderedPoints.forEach((pt, index) => {
                const li = document.createElement('li');
                li.className = 'flex items-start gap-3 bg-slate-900/60 p-3 rounded-lg border border-slate-700/60 text-sm';
                let label = index === 0 ? 'Départ' : (index === orderedPoints.length - 1 ? 'Arrivée' : `Arrêt ${index}`);
                li.innerHTML = `
                    <span class="bg-blue-600 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center shrink-0 mt-0.5">${index + 1}</span>
                    <div>
                        <span class="font-semibold text-blue-300">${label} :</span> 
                        <span class="text-slate-200">${pt.name}</span>
                    </div>
                `;
                listEl.appendChild(li);
            });

            const distKm = (tripData.distance / 1000).toFixed(1);
            const durationMin = Math.round(tripData.duration / 60);
            document.getElementById('routeMeta').innerText = `Distance estimée : ${distKm} km  |  Temps de route : ~${durationMin} min`;

            const origin = encodeURIComponent(orderedPoints[0].name);
            const destination = encodeURIComponent(orderedPoints[orderedPoints.length - 1].name);
            const waypoints = orderedPoints.slice(1, -1).map(p => encodeURIComponent(p.name)).join('|');
            const gmapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&waypoints=${waypoints}&travelmode=driving`;

            document.getElementById('gmapsLink').href = gmapsUrl;

            document.getElementById('qrcode').innerHTML = '';
            new QRCode(document.getElementById("qrcode"), {
                text: gmapsUrl,
                width: 150,
                height: 150
            });

            document.getElementById('results').classList.remove('hidden');
        }

        function getSavedRoutes() {
            return JSON.parse(localStorage.getItem('routes_history') || '[]');
        }

        function updateHistoryDropdown() {
            const select = document.getElementById('historySelect');
            select.innerHTML = '<option value="">-- Sélectionner une route enregistrée --</option>';
            const routes = getSavedRoutes();
            routes.forEach((r, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.innerText = `${r.name} (${r.stops.length} livraisons)`;
                select.appendChild(opt);
            });
        }

        function saveCurrentRoutePrompt() {
            const start = document.getElementById('start').value.trim();
            const end = document.getElementById('end').value.trim();
            const stops = Array.from(document.querySelectorAll('.stop-input')).map(i => i.value.trim()).filter(v => v !== '');

            if (!start || stops.length === 0) {
                alert("Remplissez au moins le point de départ et une adresse à sauvegarder.");
                return;
            }

            const name = prompt("Donnez un nom à cette route :", `Route du ${new Date().toLocaleDateString()}`);
            if (!name) return;

            const routes = getSavedRoutes();
            routes.unshift({ name, start, end, stops });
            localStorage.setItem('routes_history', JSON.stringify(routes.slice(0, 20)));
            updateHistoryDropdown();
        }

        function autoSaveRoute(start, end, stops) {
            const routes = getSavedRoutes();
            const name = `Dernière route (${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})})`;
            routes.unshift({ name, start, end, stops });
            localStorage.setItem('routes_history', JSON.stringify(routes.slice(0, 15)));
            updateHistoryDropdown();
        }

        function loadSelectedRoute() {
            const idx = document.getElementById('historySelect').value;
            if (idx === "") return;

            const route = getSavedRoutes()[idx];
            if (!route) return;

            document.getElementById('start').value = route.start;
            document.getElementById('end').value = route.end;

            const container = document.getElementById('stopsContainer');
            container.innerHTML = '';
            route.stops.forEach(s => addStopInput(s));
        }

        function clearHistory() {
            if (confirm("Voulez-vous supprimer tout l'historique des routes ?")) {
                localStorage.removeItem('routes_history');
                updateHistoryDropdown();
            }
        }

        updateHistoryDropdown();
    </script>
</body>
</html>
